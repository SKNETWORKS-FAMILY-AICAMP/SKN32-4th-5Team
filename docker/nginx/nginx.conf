events {}

http {
    # 🔴 **`/api/ask` 는 무인증이다** — 인증 의존성이 없고(`routes/ask.py`) 이 서버가
    #    그것을 공개한다. 질의 1건에 LLM 을 6~7회 부르므로(14 §1.3) 주소가 알려지면
    #    **비용이 그대로 나간다.** 인증을 붙이는 것은 별개의 결정이고(12 §10),
    #    그때까지 최소한 속도로 막는다 (2026-08-26 전체 점검 D).
    #
    #    분당 6건 = 사람이 시연하기에는 넉넉하고, 자동 호출에는 좁다.
    limit_req_zone $binary_remote_addr zone=ask:10m rate=6r/m;

    upstream django {
        server host.docker.internal:8000;
    }

    upstream fastapi {
        server host.docker.internal:8001;
    }

    server {
        listen 80;

        # Django가 소유한 diary API — 반드시 /api/ 일반 규칙보다 위에 있어야 함
        location = /api/records {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api/report {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 추론 질의 — 속도 제한이 걸리는 유일한 자리
        location = /api/ask {
            limit_req zone=ask burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 질의 하나가 수십 초다. 기본 60초로는 끊긴다.
            proxy_read_timeout 180s;
        }

        # 그 외 /api/* 는 FastAPI (채팅/추론)
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI의 정적 SPA(chat.html 등)도 FastAPI로
        location /static/ {
            proxy_pass http://fastapi;
        }

        # 그 외 전부 Django (채팅 내역 포함)
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
