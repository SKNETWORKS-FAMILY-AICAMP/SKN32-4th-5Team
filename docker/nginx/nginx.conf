events {}

http {
    upstream django {
        server host.docker.internal:8000;
    }

    upstream fastapi {
        server host.docker.internal:8001;
    }

    server {
        listen 80;

        # Django가 소유한 diary API — 반드시 /api/ 일반 규칙보다 위에 있어야 함
        location = /api/records {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location = /api/report {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 그 외 /api/* 는 FastAPI (채팅/추론)
        location /api/ {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI의 정적 SPA(chat.html 등)도 FastAPI로
        location /static/ {
            proxy_pass http://fastapi;
        }

        # 그 외 전부 Django (채팅 내역 포함)
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
