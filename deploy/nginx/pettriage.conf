# PetTriage — EC2 운영 nginx (`/etc/nginx/sites-enabled/pettriage`)
#
# 🔴 **여기서 고치고 EC2 에 올린다.** 반대로 하면 다시 갈라진다 (D-107 ①).
#    로컬용은 `docker/nginx/nginx.conf` 이고 **다른 물건이다** — 차이는 `deploy/README.md`.

# 🔴 **`/api/ask` 는 무인증이다.** 질의 1건에 LLM 을 6~7회 부른다 (14 §1.3) —
#    주소가 알려지면 **비용이 그대로 나간다.**
#
#    `docker/nginx/nginx.conf` 는 2026-08-26 점검 D 로 이걸 넣었는데 **EC2 에는 없었다.**
#    `12 §10` 이 *"✅ limit_req 분당 6건"* 으로 닫아 둔 항목인데, 닫힌 것은 로컬뿐이었고
#    **공개된 쪽이 열려 있었다** (2026-08-27 발견).
#
#    분당 6건 = 사람이 시연하기에는 넉넉하고, 자동 호출에는 좁다.
limit_req_zone $binary_remote_addr zone=ask:10m rate=6r/m;

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream fastapi_backend {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name pettriage.kro.kr _;

    # 사진 업로드. **셋을 같은 값으로 둔다** — 다르면 어디서 잘렸는지 모른다.
    #   privacy/images.py  5MB 에서 거절 (D-43 관문 · 실질 상한은 여기다)
    #   settings.py        6MB
    #   여기 · docker/nginx/nginx.conf  10M
    client_max_body_size 10M;

    # ── Django 가 담당하는 다이어리 API ──────────────────────────
    location = /api/records {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params_pettriage;
    }

    location = /api/report {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params_pettriage;
        # 리포트 다운로드(`?summary=1`)는 FastAPI 요약을 기다린다.
        # `diary/views.py` 의 httpx timeout 이 30초라 그보다 넉넉해야 한다.
        proxy_read_timeout 90s;
    }

    # ── 추론 질의 — 속도 제한이 걸리는 유일한 자리 ──────────────
    location = /api/ask {
        limit_req zone=ask burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params_pettriage;
        proxy_read_timeout 180s;
    }

    # ── 🔴 주인 없는 표면을 닫는다 (7b-0) ──────────────────────
    #
    #   FastAPI 에 3차 때의 계정·펫 API 가 아직 살아 있고, `location /api/` 가
    #   그것들을 **공개로 내보내고 있었다.** 우리 화면은 하나도 안 쓴다.
    #
    #       POST /api/auth/signup   무인증. Django `auth_user` 가 **아닌 다른 표**에
    #                               계정을 만든다. 아무도 안 본다
    #       POST /api/auth/login    무인증. JWT 를 발급한다
    #       GET  /api/users/me      JWT
    #            /api/pets  (5개)   JWT
    #
    #   **닫는 것과 지우는 것을 같은 작업으로 묶지 않는다.** 코드 폐기는 7b-2 이고
    #   Django 앱 테스트(7b-1)를 기다린다. 공개 표면은 오늘 닫을 수 있다.
    #   묶으면 둘 다 늦어진다 (14 §5.4).
    #
    #   되돌리기 — 이 블록 셋을 지운다. 테스트는 `TestClient` 로 앱을 직접 부르므로
    #   nginx 를 안 거친다. **여기서는 하나도 안 깨진다.**
    #
    #   `/internal/report/summarize` 는 이미 닫혀 있다 — `/api/` 가 아니라서
    #   `location /` 로 떨어지고 Django 가 404 를 낸다. Django 는 8001 을
    #   127.0.0.1 로 직접 부른다.
    location /api/auth/ { return 404; }
    location /api/users/ { return 404; }
    location /api/pets { return 404; }

    # ── 그 밖의 API ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://fastapi_backend;
        include /etc/nginx/proxy_params_pettriage;
        # 🔴 **기본 60초로는 끊긴다.** 질의 1건에 LLM 을 6~7회 부른다 (14 §1.3).
        #    `docker/nginx/nginx.conf` 는 180s 를 주는데 여기만 없었다 (2026-08-27 발견).
        proxy_read_timeout 180s;
    }

    # ── 🔴 Django 정적 파일 — 관리자 화면(SC-07)이 이것으로 산다 ──
    #
    #   `DEBUG=false` 면 Django 는 정적 파일을 내주지 않는다. 그런데
    #   `django.contrib.admin` 은 자기 CSS·JS 를 `/django-static/admin/…` 에서 가져온다.
    #   **이 블록이 없어서 배포된 `/admin/` 이 글자만 뜨고 있었다** (2026-08-27 발견 ·
    #   `10 §6.1` · `11 §6.2` · NFR-17).
    #
    #   올리기 전에 반드시:  python manage.py collectstatic --noinput
    location /django-static/ {
        alias /home/ubuntu/SKN32-4th-5Team/staticfiles/;
        access_log off;
        expires 7d;
    }

    # 반려동물 업로드 이미지
    location /media/ {
        alias /home/ubuntu/SKN32-4th-5Team/media/;
        expires 7d;
    }

    # 화면·로그인·펫 관리 등 Django
    location / {
        proxy_pass http://django_backend;
        include /etc/nginx/proxy_params_pettriage;
    }
}
